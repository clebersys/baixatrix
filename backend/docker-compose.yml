services:
  resolver:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      API_KEY: ${API_KEY:?Defina API_KEY em backend/.env}
      # Opcional: arquivo de cookies exportado do navegador (formato Netscape).
      YTDLP_COOKIES: /data/cookies.txt
    volumes:
      - ./data:/data
