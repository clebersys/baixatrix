services:
  resolver:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Deixe vazio para desativar a exigência de chave.
      API_KEY: ""
      # Opcional: arquivo de cookies exportado do navegador (formato Netscape).
      YTDLP_COOKIES: /data/cookies.txt
    volumes:
      - ./data:/data
